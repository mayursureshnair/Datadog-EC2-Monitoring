<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Soft Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="boxShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    
    <!-- Arrow Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Outer Canvas Card -->
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Main Header -->
  <g transform="translate(60, 48)">
    <text x="540" y="22" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5">EC2 Infrastructure Monitoring &amp; Alerting Architecture</text>
    <text x="540" y="44" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">End-to-End Telemetry Pipeline, Live Dashboards, &amp; Automated Incident Response</text>
  </g>

  <!-- ================= SECTION 1: AWS EC2 ================= -->
  <g transform="translate(50, 115)">
    <!-- Container -->
    <rect x="0" y="0" width="320" height="510" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <!-- Header Badge -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#ff9900"/>
    <text x="36" y="42" text-anchor="middle" font-size="20">☁️</text>
    <text x="64" y="34" font-size="16" font-weight="700" fill="#0f172a">AWS Cloud</text>
    <text x="64" y="49" font-size="12" font-weight="500" fill="#64748b">EC2 Compute Host</text>
    <line x1="18" y1="66" x2="302" y2="66" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Component 1: EC2 Host -->
    <g transform="translate(18, 80)">
      <rect x="0" y="0" width="284" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#fed7aa"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">🖥️</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#0f172a">datadog-monitoring-lab</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#ea580c">Ubuntu Linux Instance</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="70" font-size="12" fill="#475569">Instance ID: <tspan font-weight="600" fill="#0f172a">i-02bc3e68d9e4a33f2</tspan></text>
      <text x="14" y="88" font-size="12" fill="#475569">Public IP: <tspan font-weight="600" fill="#0f172a">18.209.4.110</tspan></text>
      <text x="14" y="104" font-size="11" fill="#64748b">Private IP: 172.31.23.61</text>
    </g>

    <!-- Component 2: stress-ng -->
    <g transform="translate(18, 210)">
      <rect x="0" y="0" width="284" height="110" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#ffedd5"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">⚡</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#9a3412">stress-ng Simulator</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#c2410c">Load Generation Utility</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#fed7aa" stroke-width="1"/>
      <text x="14" y="72" font-size="12" fill="#7c2d12">Action: <tspan font-weight="600">Dispatches 2 CPU stress hogs</tspan></text>
      <text x="14" y="90" font-size="12" fill="#7c2d12">Target: <tspan font-weight="600">Saturates 100% CPU cores</tspan></text>
      <text x="14" y="104" font-size="11" fill="#9a3412">Sandbox: /tmp/stress-ng</text>
    </g>

    <!-- Local Flow: stress-ng -> Host -->
    <!-- Component 3: Datadog Agent -->
    <g transform="translate(18, 340)">
      <rect x="0" y="0" width="284" height="145" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#ede9fe"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">🐶</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#5b21b6">Datadog Agent v7</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#7c3aed">Supervised systemd Daemon</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#ddd6fe" stroke-width="1"/>
      <text x="14" y="72" font-size="12" fill="#4c1d95">Telemetry Collected:</text>
      <text x="14" y="90" font-size="12" font-weight="600" fill="#5b21b6">• CPU, Memory, Disk, System Load</text>
      <text x="14" y="110" font-size="12" fill="#4c1d95">Memory Footprint: <tspan font-weight="600">~151 MB</tspan></text>
      <text x="14" y="130" font-size="11.5" font-weight="600" fill="#16a34a">● Status: Active &amp; Running</text>
    </g>
  </g>

  <!-- Connector 1 (AWS -> Datadog Cloud) -->
  <g transform="translate(375, 360)">
    <!-- Pill background -->
    <rect x="0" y="-32" width="60" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="30" y="-14" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">HTTPS</text>
    <text x="30" y="-1" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">Port 443</text>
    <line x1="-5" y1="14" x2="55" y2="14" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- ================= SECTION 2: DATADOG CLOUD ================= -->
  <g transform="translate(440, 115)">
    <!-- Container -->
    <rect x="0" y="0" width="320" height="510" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <!-- Header Badge -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#632ca6"/>
    <text x="36" y="42" text-anchor="middle" font-size="20">🟣</text>
    <text x="64" y="34" font-size="16" font-weight="700" fill="#0f172a">Datadog Cloud</text>
    <text x="64" y="49" font-size="12" font-weight="500" fill="#64748b">US5 Region (us5.datadoghq.com)</text>
    <line x1="18" y1="66" x2="302" y2="66" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Component 1: Ingestion API -->
    <g transform="translate(18, 80)">
      <rect x="0" y="0" width="284" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#f1f5f9"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">📥</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#0f172a">Telemetry Ingestion</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#632ca6">Real-Time Ingestion Engine</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="70" font-size="12" fill="#475569">Environment: <tspan font-weight="600" fill="#0f172a">dev (DD_ENV=dev)</tspan></text>
      <text x="14" y="88" font-size="12" fill="#475569">Protocol: <tspan font-weight="600" fill="#0f172a">TLS 1.3 Outbound</tspan></text>
      <text x="14" y="104" font-size="11" fill="#64748b">Continuous Time-Series Ingestion</text>
    </g>

    <!-- Component 2: Dashboard -->
    <g transform="translate(18, 210)">
      <rect x="0" y="0" width="284" height="110" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#e0f2fe"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">📊</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#0369a1">Custom Dashboard</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#0284c7">EC2 Infrastructure Monitoring</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#bae6fd" stroke-width="1"/>
      <text x="14" y="70" font-size="12" fill="#0c4a6e">1. CPU Utilization (%)</text>
      <text x="14" y="88" font-size="12" fill="#0c4a6e">2. System Load (1-min queue)</text>
      <text x="14" y="104" font-size="11" fill="#0369a1">3. Memory (MiB) &amp; 4. Disk Usage (%)</text>
    </g>

    <!-- Component 3: Monitor -->
    <g transform="translate(18, 340)">
      <rect x="0" y="0" width="284" height="145" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#f3e8ff"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">🎯</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#6b21a8">Metric Monitor</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#7e22ce">EC2 - High CPU Usage</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#e9d5ff" stroke-width="1"/>
      <text x="14" y="72" font-size="11.5" fill="#581c87">Query: <tspan font-family="monospace" font-weight="600">system.cpu.user</tspan></text>
      <text x="14" y="90" font-size="11.5" fill="#581c87">Evaluation: <tspan font-weight="600">Rolling 5m Average</tspan></text>
      <text x="14" y="110" font-size="11.5" fill="#581c87">Warning Threshold: <tspan font-weight="700" fill="#b45309">&gt; 60%</tspan></text>
      <text x="14" y="128" font-size="11.5" fill="#581c87">Alert Threshold: <tspan font-weight="700" fill="#b91c1c">&gt; 85%</tspan></text>
    </g>
  </g>

  <!-- Connector 2 (Datadog -> Alerting) -->
  <g transform="translate(765, 360)">
    <!-- Pill background -->
    <rect x="0" y="-32" width="60" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#boxShadow)"/>
    <text x="30" y="-14" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">ALERTS</text>
    <text x="30" y="-1" text-anchor="middle" font-size="9" font-weight="600" fill="#64748b">Triggers</text>
    <line x1="-5" y1="14" x2="55" y2="14" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  </g>

  <!-- ================= SECTION 3: ALERTING ================= -->
  <g transform="translate(830, 115)">
    <!-- Container -->
    <rect x="0" y="0" width="320" height="510" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <!-- Header Badge -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#dc2626"/>
    <text x="36" y="42" text-anchor="middle" font-size="20">🚨</text>
    <text x="64" y="34" font-size="16" font-weight="700" fill="#0f172a">Alerting &amp; Notifications</text>
    <text x="64" y="49" font-size="12" font-weight="500" fill="#64748b">Automated Stakeholder Dispatch</text>
    <line x1="18" y1="66" x2="302" y2="66" stroke="#f1f5f9" stroke-width="2"/>

    <!-- State 1: WARN -->
    <g transform="translate(18, 80)">
      <rect x="0" y="0" width="284" height="110" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#fef3c7"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">🟡</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#92400e">Warning Level</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#b45309">Condition: 60% &lt; CPU &lt;= 85%</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#fde68a" stroke-width="1"/>
      <text x="14" y="70" font-size="12" fill="#78350f">Event: <tspan font-weight="600">Early anomaly detected</tspan></text>
      <text x="14" y="88" font-size="12" fill="#78350f">Action: <tspan font-weight="600">Warn email dispatched</tspan></text>
      <text x="14" y="104" font-size="11" fill="#b45309">Target: @mayursureshnair@gmail.com</text>
    </g>

    <!-- State 2: ALERT -->
    <g transform="translate(18, 210)">
      <rect x="0" y="0" width="284" height="110" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#fee2e2"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">🔴</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#991b1b">Critical Alert Level</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#dc2626">Condition: CPU &gt; 85%</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#fecaca" stroke-width="1"/>
      <text x="14" y="70" font-size="12" fill="#7f1d1d">Event: <tspan font-weight="600">Compute saturation breached</tspan></text>
      <text x="14" y="88" font-size="12" fill="#7f1d1d">Action: <tspan font-weight="600">Triggered email dispatched</tspan></text>
      <text x="14" y="104" font-size="11" fill="#b91c1c">Urgent incident notification</text>
    </g>

    <!-- State 3: RECOVERY -->
    <g transform="translate(18, 340)">
      <rect x="0" y="0" width="284" height="145" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#dcfce7"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">🟢</text>
      <text x="46" y="27" font-size="14" font-weight="700" fill="#166534">Automatic Recovery</text>
      <text x="46" y="42" font-size="11" font-weight="600" fill="#16a34a">Condition: CPU &lt;= 60.0%</text>
      
      <line x1="14" y1="52" x2="270" y2="52" stroke="#bbf7d0" stroke-width="1"/>
      <text x="14" y="72" font-size="12" fill="#14532d">Trigger: <tspan font-weight="600">stress-ng stopped (Ctrl+C)</tspan></text>
      <text x="14" y="90" font-size="12" fill="#14532d">Cooldown: <tspan font-weight="600">Metric dropped to 41.68%</tspan></text>
      <text x="14" y="110" font-size="12" fill="#14532d">Action: <tspan font-weight="600">Recovered email dispatched</tspan></text>
      <text x="14" y="130" font-size="11.5" font-weight="700" fill="#15803d">✓ Status restored to OK</text>
    </g>
  </g>
</svg>
